{% if page > 1 or has_more %}
<div class="mi-pagination">
  {% if page > 1 %}
    <a class="btn-voltar-item" href="?q={{ q|urlencode }}&status={{ status|urlencode }}&categoria={{ categoria|urlencode }}&page={{ page|add:"-1" }}">
      <i class="bi bi-chevron-left"></i> Anterior
    </a>
  {% endif %}
  <span class="mi-page-current">Página {{ page }}</span>
  {% if has_more %}
    <a class="btn-filtrar" href="?q={{ q|urlencode }}&status={{ status|urlencode }}&categoria={{ categoria|urlencode }}&page={{ next_page }}">
      Próxima <i class="bi bi-chevron-right"></i>
    </a>
  {% endif %}
</div>
{% endif %}
